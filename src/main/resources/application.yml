spring:
    application:
        name: order-service
    jpa:
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                default_schema: order_service
                hbm2ddl.create_namespaces: true # 스키마 자동 생성

    kafka:
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all                                 # 모든 ISR 복제본으로부터 ack 수신 후 성공 처리
            retries: 3                                # 일시적 오류 시 최대 3회 재시도
            properties:
                enable.idempotence: true              # 재시도로 인한 중복 메시지 방지 (exactly-once)
                max.in.flight.requests.per.connection: 5
                retry.backoff.ms: 1000
                max.block.ms: 3000
        # 인벤토리에서 오는 승인/거절 이벤트를 받기 위한 컨슈머 설정
        consumer:
            group-id: order-service-consumer
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
            properties:
                spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
                spring.json.trusted.packages: "com.michelet.order.application.dto"
                spring.json.use.type.headers: true
                spring.json.type.mapping: "com.michelet.inventory.infrastructure.messaging.dto.OrderApprovedEvent:com.michelet.order.application.dto.OrderApprovedMessage,com.michelet.inventory.infrastructure.messaging.dto.OrderRejectedEvent:com.michelet.order.application.dto.OrderRejectedMessage"

server:
    port: 19700

order:
    kafka:
        topic:
            # 개별 토픽을 단일 커맨드 토픽(inventory.command)으로 통일
            created: "inventory.command"
            stock-restore: "inventory.command"
            approved: "order.approved"
            rejected: "order.rejected"
    outbox:
        max-retries: 3 # 최대 재시도 횟수 설정

internal:
    auth:
        secret: ${INTERNAL_AUTH_SECRET}
jwt:
    secret: ${JWT_SECRET}

# Feign Client 목적지 URL 설정
client:
    reservation-service:
        url: ${RESERVATION_SERVICE_URL:http://localhost:19500}
    catalog-service:
        url: ${CATALOG_SERVICE_URL:http://localhost:19800}

# 외부 API(Feign) 호출 시 무한 대기(블로킹) 방지용 타임아웃 설정 추가
feign:
    client:
        config:
            default:
                connectTimeout: 1000   # 기본 연결 타임아웃: 1초
                readTimeout: 3000      # 기본 읽기 타임아웃: 3초

logging:
    level:
        root: INFO
        # 카프카 및 유레카 관련 잡다한 INFO 로그 억제 (경고 이상만 출력)
        org.apache.kafka: WARN
        com.netflix.discovery: WARN
        org.springframework.kafka: WARN
