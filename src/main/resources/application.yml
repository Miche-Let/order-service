spring:
    application:
        name: order-service
    jpa:
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                default_schema: order_service
                hbm2ddl.create_namespaces: true # 스키마 자동 생성

    kafka:
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all                                 # 모든 ISR 복제본으로부터 ack 수신 후 성공 처리
            retries: 3                                # 일시적 오류 시 최대 3회 재시도
            properties:
                enable.idempotence: true              # 재시도로 인한 중복 메시지 방지 (exactly-once)
                max.in.flight.requests.per.connection: 5
                retry.backoff.ms: 1000
                max.block.ms: 3000

server:
    port: 19700

order:
    kafka:
        topic:
            stock-restore: "stock.restored"
    outbox:
        max-retries: 3 # 최대 재시도 횟수 설정

internal:
    auth:
        secret: ${INTERNAL_AUTH_SECRET}
jwt:
    secret: ${JWT_SECRET}

# Feign Client 목적지 URL 설정
client:
    reservation-service:
        url: ${RESERVATION_SERVICE_URL:http://localhost:19500}
    inventory-service:
        url: ${INVENTORY_SERVICE_URL:http://localhost:19900}
    catalog-service:
        url: ${CATALOG_SERVICE_URL:http://localhost:19800}

# 외부 API(Feign) 호출 시 무한 대기(블로킹) 방지용 타임아웃 설정 추가
feign:
    client:
        config:
            default:
                connectTimeout: 1000   # 기본 연결 타임아웃: 1초
                readTimeout: 3000      # 기본 읽기 타임아웃: 3초
            inventory-service: # Inventory 서비스 전용 특별 타임아웃 (@FeignClient의 name과 일치해야 함)
                connectTimeout: 500
                readTimeout: 2000

logging:
    level:
        root: INFO
        # 카프카 및 유레카 관련 잡다한 INFO 로그 억제 (경고 이상만 출력)
        org.apache.kafka: WARN
        com.netflix.discovery: WARN
        org.springframework.kafka: WARN
